<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13284A">
<meta name="robots" content="noindex,nofollow">
<title>数据面板 · Wei的行情观察室</title>
<script>try{var t=localStorage.getItem('h5theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#13284A;--sunk:#1B3A66;--ink:#EAF0FA;--ink2:#B3C3DC;--ink3:#7E94B5;--rule:#2F4D7C;--rule2:#213B63;--up:#FF5B50;--dn:#2BC48A;--c1:#6AA6FF;--c2:#E0B458;--m20:#B98CFF}
:root[data-theme=light]{--bg:#FBE9CF;--sunk:#F4D9B1;--ink:#1F2A44;--ink2:#58506A;--ink3:#9A8467;--rule:#D9BE97;--rule2:#EBD3AE;--up:#C62F25;--dn:#17794F;--c1:#2D5BA8;--c2:#B5651D;--m20:#8A4FB0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 10px}
header a{color:var(--ink2);text-decoration:none;font-size:13px;padding:6px 0}
header h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.12em}
header .sub{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--ink3);text-align:center}
#tg{width:30px;height:30px;border-radius:15px;border:1px solid var(--ink3);background:none;color:var(--ink2);font-size:15px;line-height:1;cursor:pointer}
nav#tabs{position:sticky;top:0;z-index:5;display:flex;gap:0;background:var(--bg);border-bottom:1px solid var(--rule);margin:0 -16px;padding:0 16px}
nav#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink3);font-weight:700;font-size:14px;line-height:1;font-family:inherit;padding:13px 0 11px;cursor:pointer;letter-spacing:.06em}
nav#tabs button.on{color:var(--ink);border-bottom-color:var(--c2)}
section.pane{display:none;padding-top:14px}
section.pane.on{display:block}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:none;color:var(--ink2);font-weight:500;font-size:13px;line-height:1;font-family:inherit;padding:8px 12px;border-radius:16px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:4px;margin-right:6px;vertical-align:1px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:0 8px 8px 0}
.seg button{background:none;border:0;color:var(--ink2);font-weight:500;font-size:13px;line-height:1;font-family:inherit;padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--sunk);color:var(--ink);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;align-items:center}
.head{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
.head b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.head span{font-size:15px;font-weight:700}
.head small{color:var(--ink3);font-size:12px;margin-left:auto}
.up{color:var(--up)}.dn{color:var(--dn)}
.box{border:1px solid var(--rule2);background:rgba(128,128,128,.06);padding:8px 8px 4px;margin-top:6px;position:relative}
.box h3{margin:0 0 2px;font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:700}
.box h3 em{font-style:normal;color:var(--ink3);font-weight:500;letter-spacing:0;margin-left:6px}
svg.ch{display:block;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
svg .gl{stroke:var(--rule2);stroke-width:1}
svg .tx{fill:var(--ink3);font-size:10px;font-family:inherit}
svg .cu{fill:var(--up);stroke:var(--up)}
svg .cd{fill:var(--dn);stroke:var(--dn)}
svg .vu{fill:var(--up);opacity:.5}
svg .vd{fill:var(--dn);opacity:.5}
svg .fl{fill:var(--ink3);opacity:.55}
svg .ln{fill:none;stroke:var(--c1);stroke-width:1.6;stroke-linejoin:round}
svg .m5{fill:none;stroke:var(--c2);stroke-width:1.2}
svg .m10{fill:none;stroke:var(--c1);stroke-width:1.2}
svg .m20{fill:none;stroke:var(--m20);stroke-width:1.2}
svg .m60{fill:none;stroke:var(--ink3);stroke-width:1.2}
svg .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
svg .hl{fill:var(--ink);opacity:.1}
svg .bar{fill:var(--c2);opacity:.85}
svg .avg{fill:none;stroke:var(--c1);stroke-width:1.6}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.ig div{font-size:12px;color:var(--ink3)}
.ig div b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.ig div b.up{color:var(--up)}.ig div b.dn{color:var(--dn)}
.ih{font-size:12px;color:var(--ink2);margin-top:8px}
.ih b{color:var(--ink);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stats div{border:1px solid var(--rule2);padding:9px 10px;font-size:12px;color:var(--ink3)}
.stats div b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats div b.up{color:var(--up)}.stats div b.dn{color:var(--dn)}
.stats div i{font-style:normal;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink3);text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule)}
td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--rule2);font-size:13px}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--sunk)}
tbody tr{cursor:pointer}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;margin:10px 0 0}
.empty{padding:26px 8px;text-align:center;color:var(--ink3);font-size:13px}
.sb{display:flex;gap:8px;margin:2px 0 8px}
.sb input,.sb select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:15px;min-width:0}
.sb input{flex:1}
.sb select{flex:none;max-width:42%;font-size:14px}
.sb input::placeholder{color:var(--ink3)}
.nl{margin-top:4px}
.nl .it{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--rule2)}
.nl .it time{font-size:12.5px;font-weight:700;color:var(--c2);font-variant-numeric:tabular-nums;padding-top:2px}
.nl .it p{margin:0;font-size:15px;line-height:1.5;font-weight:500}
.nl .it small{display:block;margin-top:4px;color:var(--ink3);font-size:11.5px}
.nl .dh{margin:14px 0 0;font-size:12px;letter-spacing:.14em;color:var(--ink3);font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--rule)}
mark{background:var(--c2);color:var(--bg);padding:0 1px;border-radius:2px}
.more{display:block;width:100%;margin:14px 0 0;padding:12px;border:1px solid var(--rule);background:none;color:var(--ink2);font-weight:600;font-size:14px;line-height:1;font-family:inherit;cursor:pointer;border-radius:8px}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);font-size:11.5px;line-height:1.7;color:var(--ink3)}
:root[data-theme=light]{--bg:#fff;--sunk:#f1f4f8;--rule:#bdc9d9;--rule2:#dae3ee;--ink3:#58687d}
.over-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.over-block{min-width:0;border-top:2px solid var(--c1);padding:10px 0;margin-bottom:14px}
.over-block h2{font-size:16px;margin:0 0 8px}
.over-block svg{width:100%;height:140px;display:block}
.over-ring{width:132px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:5px auto 10px}
.over-ring b{width:74%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center}
#over-breadth{text-align:center}
#over-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#over-table th,#over-table td{text-align:right;padding:7px 5px;border-bottom:1px solid var(--rule2)}
#over-table th:first-child,#over-table td:first-child{text-align:left;white-space:nowrap}
#over-table th,#over-table tr:nth-child(even){background:var(--sunk)}
#over-table button,#over-detail{color:var(--c1);background:none;border:0;font:inherit;cursor:pointer;padding:4px 0}
#over-table button[aria-pressed=true]{font-weight:800;text-decoration:underline}
.over-move{display:grid;grid-template-columns:60px minmax(40px,1fr);gap:5px;align-items:center}
.over-bar{position:relative;height:12px;background:linear-gradient(90deg,transparent 49.5%,var(--ink3) 50%,transparent 50.5%)}
.over-bar i{position:absolute;height:8px;top:2px;background:currentColor}
@media(max-width:600px){.over-grid{grid-template-columns:1fr;gap:0}nav#tabs button{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a id="back" href="index.html">‹ 今日卡片</a>
  <h1>数据面板<span class="sub">Wei的行情观察室</span></h1>
  <button id="tg" title="切换深浅主题"></button>
</header>
<nav id="tabs">
  <button data-t="overview" class="on">盘面总览</button>
  <button data-t="idx">指数走势</button>
  <button data-t="mkt">市场温度</button>
  <button data-t="news">快讯检索</button>
</nav>

<section class="pane on" id="p-overview">
  <p class="note" id="over-date" role="status">正在加载行情…</p>
  <div class="over-grid">
    <div class="over-block"><h2 id="over-title">上证指数</h2><div id="over-line"></div>
      <button id="over-detail">查看详细走势 ›</button><p class="note">近 20 个交易日 · 新浪指数日K</p></div>
    <div class="over-block"><h2>市场涨跌分布</h2><div id="over-breadth"></div></div>
  </div>
  <div class="over-block"><h2>八大指数对比</h2>
    <table id="over-table"><thead><tr><th scope="col">指数</th><th scope="col">点位</th><th scope="col">涨跌幅</th></tr></thead><tbody></tbody></table>
    <p class="note">新浪指数日K · 相对前一交易日收盘 · 条形共用零线与刻度</p>
  </div>
</section>

<section class="pane" id="p-idx">
  <div class="row" id="ichips"></div>
  <div class="head"><b id="ipx">—</b><span id="ichg"></span><small id="idt"></small></div>
  <div class="ctl">
    <div class="seg" id="sper"><button data-v="D">日K</button><button data-v="W">周K</button><button data-v="M">月K</button></div>
    <div class="seg" id="srng"></div>
    <div class="seg" id="smode"><button data-v="K">K线</button><button data-v="L">折线</button></div>
  </div>
  <div class="row" id="smas"></div>
  <div class="box"><div id="ichart"></div></div>
  <div id="iinfo"></div>
  <div class="stats" id="istat"></div>
  <p class="note">按收盘后的日线整理；周K、月K由日线合成。均线、涨跌幅均按收盘价计算。图上拖动（手机）或移动鼠标（电脑）可看每根的数值。</p>
</section>

<section class="pane" id="p-mkt">
  <div class="ctl"><div class="seg" id="mrng"><button data-v="10">近10日</button><button data-v="20">近20日</button><button data-v="60">近60日</button><button data-v="0">全部</button></div></div>
  <div class="ih" id="minfo"></div>
  <div class="box"><h3>沪深成交额<em>万亿 · 线为5日均值</em></h3><div id="c-amt"></div></div>
  <div class="box"><h3>涨跌家数占比<em>红涨 · 灰平 · 绿跌</em></h3><div id="c-brd"></div></div>
  <div class="box"><h3>涨停 / 跌停家数</h3><div id="c-lim"></div></div>
  <table id="mtab"><thead><tr><th>日期</th><th>成交额</th><th>涨 / 跌</th><th>涨停 / 跌停</th></tr></thead><tbody></tbody></table>
  <p class="note" id="mnote"></p>
</section>

<section class="pane" id="p-news">
  <div class="sb"><input id="nq" type="search" placeholder="输入关键词，空格分隔表示同时包含" enterkeyhint="search"><select id="nd"></select></div>
  <div class="row" id="ntags"></div>
  <div class="row" id="nkw"></div>
  <div class="ih" id="ncount"></div>
  <div class="nl" id="nlist"></div>
  <button class="more" id="nmore" style="display:none">再显示 60 条</button>
  <p class="note">只收录快讯的标题和发布时间，来源为新浪 7x24；按每次整理时抓到的内容累积，没抓到的时段查不到。</p>
</section>

<footer id="foot"></footer>
</div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return ESC[c]})}
function fx(v,n){return v==null?'—':v.toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n})}
function pct(v,n){return v==null?'—':(v>0?'+':'')+(v*100).toFixed(n==null?2:n)+'%'}
function pcu(v){return v==null?'—':(v*100).toFixed(2)+'%'}
function cls(v){return v>0?'up':v<0?'dn':''}
function fv(v){return v>=1e8?(v/1e8).toFixed(1)+'亿':(v/1e4).toFixed(0)+'万'}
var KEY='panelState';
var S={code:'sh000001',per:'D',rng:'6M',mode:'K',ma:[5,20],tab:'idx',mrng:20,tag:''};
try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in o)if(k in S)S[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function getJSON(p){return fetch(p,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(p+' '+r.status);return r.json()})}
function fail(el,e){el.innerHTML='<div class="empty">数据没加载出来。'+(location.protocol==='file:'?'这个页面要通过网址打开，不能直接双击本地文件。':'请稍后刷新重试。')+'</div>';if(window.console)console.warn(e)}
function seg(el,val,cb){
  $$('button',el).forEach(function(b){b.className=String(b.getAttribute('data-v'))===String(val)?'on':'';
    b.onclick=function(){cb(b.getAttribute('data-v'))}});
}

// ---------- 主题与标签页 ----------
var root=document.documentElement;
function theme(){return root.getAttribute('data-theme')==='light'?'light':'dark'}
function paintTheme(){$('#tg').textContent=theme()==='light'?'☾':'☀';$('#back').href=theme()==='light'?'light.html':'index.html'}
$('#tg').onclick=function(){var n=theme()==='light'?'dark':'light';try{localStorage.setItem('h5theme',n)}catch(e){}
  root.setAttribute('data-theme',n);paintTheme()};
paintTheme();
var inited={};
function show(t){
  if(!/^(overview|idx|mkt|news)$/.test(t))t='overview';
  S.tab=t;save();
  $$('#tabs button').forEach(function(b){b.className=b.getAttribute('data-t')===t?'on':''});
  $$('section.pane').forEach(function(p){p.className='pane'+(p.id==='p-'+t?' on':'')});
  try{history.replaceState(null,'','#'+t)}catch(e){}
  if(!inited[t]){inited[t]=1;({overview:initOverview,idx:initIdx,mkt:initMkt,news:initNews})[t]()}
  else if(t==='idx')drawIdx();else if(t==='mkt')drawMkt();
}
$$('#tabs button').forEach(function(b){b.onclick=function(){show(b.getAttribute('data-t'))}});

// ---------- 指数走势 ----------
var CODES=[['sh000001','上证指数'],['sz399001','深证成指'],['sz399006','创业板指'],['sh000688','科创50'],
  ['sh000300','沪深300'],['sh000905','中证500'],['sh000016','上证50'],['sh000852','中证1000']];
var RNG={D:['3M','6M','1Y','3Y','ALL'],W:['6M','1Y','3Y','ALL'],M:['1Y','3Y','ALL']};
var RLAB={'3M':'3个月','6M':'6个月','1Y':'1年','3Y':'3年','ALL':'全部'};
var RMON={'3M':3,'6M':6,'1Y':12,'3Y':36,'ALL':0};
var MAS=[[5,'m5','MA5'],[10,'m10','MA10'],[20,'m20','MA20'],[60,'m60','MA60']];
var MACOL={m5:'var(--c2)',m10:'var(--c1)',m20:'var(--m20)',m60:'var(--ink3)'};
var KL={},all=[],mas={},view={i0:0,n:0},sel=0,geo=null;
function indexRows(code){
  if(KL[code])return Promise.resolve(KL[code]);
  return getJSON('data/kline_'+code+'.json').then(function(data){return KL[code]=data.rows});
}

async function initOverview(){
  try{
    var market=getJSON('data/market.json').catch(function(){return []});
    var histories=await Promise.all(CODES.map(function(index){
      return indexRows(index[0]).catch(function(){return []});
    }));
    var entries=histories.map(function(rows,i){
      var latest=rows.at(-1), previous=rows.at(-2);
      return {code:CODES[i][0],name:CODES[i][1],rows:rows.slice(-20),date:latest?latest[0]:'',
        close:latest?latest[4]:null,change:latest&&previous&&previous[4]>0?latest[4]/previous[4]-1:null};
    });
    var date=entries.map(function(entry){return entry.date}).sort().pop();
    var scale=Math.max(0.0001,...entries.filter(function(entry){return entry.date===date})
      .map(function(entry){return Math.abs(entry.change)}));
    var session=sess();
    $('#over-date').textContent=date ? '行情日期 '+date+(session&&session.date===date?' · '+sessTxt():'')+
      (META&&META.updated?' · 更新于 '+META.updated:'') : '暂无指数行情';
    $('#over-table tbody').innerHTML=entries.map(function(entry){
      var change=entry.date===date?entry.change:null, width=Math.abs(change)/scale*50;
      return '<tr><td><button type="button">'+entry.name+'</button></td><td>'+
        fx(entry.date===date?entry.close:null,2)+'</td><td><div class="over-move '+cls(change)+'">'+
        '<span>'+pct(change)+'</span><span class="over-bar" aria-hidden="true"><i style="width:'+width+
        '%;left:'+(change<0?50-width:50)+'%"></i></span></div></td></tr>';
    }).join('');
    var buttons=$$('#over-table button');
    function select(i){
      var entry=entries[i], rows=entry.rows, chart=$('#over-line');
      buttons.forEach(function(button,j){button.setAttribute('aria-pressed',String(i===j))});
      $('#over-title').textContent=entry.name+'走势';
      $('#over-detail').onclick=function(){
        var initialized=inited.idx;
        S.code=entry.code;
        show('idx');
        if(initialized)loadIdx();
      };
      if(rows.length<2){chart.textContent='暂无足够的走势数据';return}
      var values=rows.map(function(row){return row[4]});
      var lo=Math.min(...values), hi=Math.max(...values);
      var points=values.map(function(value,j){
        return (4+j*312/(values.length-1)).toFixed(2)+','+(hi===lo?50:95-90*(value-lo)/(hi-lo)).toFixed(2);
      }).join(' ');
      chart.innerHTML='<svg viewBox="0 0 320 100" role="img" aria-label="近期收盘走势"><polyline points="'+
        points+'" fill="none" stroke="var(--c1)" stroke-width="2.5"/></svg><p class="note">'+
        esc(rows[0][0])+' 至 '+esc(entry.date)+' · '+fx(entry.close,2)+'</p>';
    }
    buttons.forEach(function(button,i){button.onclick=function(){select(i)}});
    select(0);

    var row=(await market).find(function(item){return item.date===date});
    var breadth=$('#over-breadth');
    var total=row&&row.up+row.down+row.flat;
    if(!row||![row.up,row.down,row.flat].every(Number.isFinite)||total<=0){
      breadth.textContent='暂无该交易日的涨跌家数';
      return;
    }
    var up=row.up/total*100, down=(row.up+row.down)/total*100;
    breadth.innerHTML='<div class="over-ring" style="background:conic-gradient(var(--up) 0 '+up+
      '%,var(--dn) '+up+'% '+down+'%,var(--ink3) '+down+'% 100%)"><b>'+fx(total,0)+' 家</b></div>'+
      '<span class="up">涨 '+fx(row.up,0)+'</span> · <span class="dn">跌 '+fx(row.down,0)+
      '</span> · 平 '+fx(row.flat,0)+'<p class="note">按数据源统计口径'+
      (row.p?' · 截至 '+esc(row.p):'')+'</p>';
  }catch(error){fail($('#over-date'),error)}
}

    if(x.d!==cur){cur=x.d;out+='<div class="dh">'+x.d+'</div>'}
    var t=esc(x.h);if(re)t=t.replace(re,'<mark>$1</mark>');
    out+='<div class="it"><time>'+x.t+'</time><p>'+t+'<small>'+esc(x.g)+' · 新浪7x24</small></p></div>'});
  $('#nlist').innerHTML=out||'<div class="empty">没有匹配的快讯。试试换个词，或放宽频道、日期。</div>';
  $('#nmore').style.display=hit.length>nlimit?'block':'none';
  $('#nmore').textContent='再显示 60 条（还有 '+(hit.length-nlimit)+' 条）';
}

// ---------- 页脚 ----------
var META=null;
function sess(){var s=META&&META.session;return s&&(s.state==='midday'||s.state==='intraday')?s:null}
function sessTxt(){var s=sess();return s?(s.state==='midday'?'午间休市':'盘中')+'数据（截至 '+s.asof+'）':''}
getJSON('data/meta.json').catch(function(){return null}).then(function(m){
  META=m;
  if(m){$('#foot').innerHTML=(sess()?'<b style="color:var(--c2)">今日（'+esc(sess().date)+'）为'+sessTxt()+'，不是收盘值，收盘后才是最终数据。</b><br>':'')+
    '数据整理于 '+esc(m.updated)+'，指数日K截至 '+esc(m.kline_last)+'；非实时行情。<br>数据来自公开网页行情接口，可能有延迟或误差，本页仅作信息整理，不构成任何投资建议，市场有风险，据此操作风险自负。'}
  else $('#foot').textContent='数据来自公开网页行情接口，可能有延迟或误差，本页仅作信息整理，不构成任何投资建议。';
  var h=(location.hash||'').slice(1);
  show(/^(overview|idx|mkt|news)$/.test(h)?h:'overview');
});
})();
</script>
